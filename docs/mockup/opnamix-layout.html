<title>Opnamix Layout Baru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: rail sidebar bergradien (hover = buka, pin = kunci) + area kerja terang.
   Header halaman = satu pita gradien ringkas berisi judul, chip statistik, dan aksi.
   Isi = daftar (grid card / baris) + panel kanan untuk form & detail; transaksi baru = layar POS. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#F6F7FB; --border:#E3E7F0; --border-strong:#CFD6E4;
  --fg:#131A2B; --muted:#576075; --faint:#8790A3;
  --primary:#2563EB; --primary-btn:#2563EB; --primary-ink:#1D4ED8; --primary-soft:#EAF0FE;
  --ok:#15803D; --ok-soft:#E7F5EC; --warn:#B45309; --warn-soft:#FDF2E1; --bad:#C81E1E; --bad-soft:#FDECEC;
  --c-obat:#2563EB; --c-bhp:#0F8A80; --c-imun:#7C3AED; --c-alkes:#C2410C;
  --grad-hero:radial-gradient(90% 170% at 100% 0%, rgba(130,170,255,.5), transparent 60%), linear-gradient(118deg,#0A2466 0%,#1543C2 58%,#3B6CF2 100%);
  --grad-side:linear-gradient(185deg,#0A2160 0%,#123A9E 58%,#2556D6 100%);
  --on-grad:#FFFFFF; --on-grad-2:rgba(255,255,255,.76); --on-grad-3:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.11); --glass-2:rgba(255,255,255,.2); --glass-line:rgba(255,255,255,.16);
  --dot-warn:#FBBF24; --dot-bad:#FB7185; --dot-ok:#4ADE80;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 18px 40px rgba(10,20,50,.2);
  --scrim:rgba(8,14,30,.45);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --rail:64px; --sbw:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#141820; --surface-2:#1A1F29; --border:#252B36; --border-strong:#353D4C;
  --fg:#E6E9EF; --muted:#9EA6B5; --faint:#6F7788;
  --primary:#6E9BFF; --primary-btn:#2F66EE; --primary-ink:#A3BEFF; --primary-soft:rgba(110,155,255,.14);
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.12); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.12); --bad:#F87171; --bad-soft:rgba(248,113,113,.13);
  --c-obat:#6E9BFF; --c-bhp:#2DD4BF; --c-imun:#A78BFA; --c-alkes:#FB923C;
  --grad-hero:radial-gradient(90% 170% at 100% 0%, rgba(90,130,255,.3), transparent 60%), linear-gradient(118deg,#0B1430 0%,#142A66 60%,#2445A8 100%);
  --grad-side:linear-gradient(185deg,#0A0F1F 0%,#0F1C42 60%,#172E6C 100%);
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#141820; --surface-2:#1A1F29; --border:#252B36; --border-strong:#353D4C;
  --fg:#E6E9EF; --muted:#9EA6B5; --faint:#6F7788;
  --primary:#6E9BFF; --primary-btn:#2F66EE; --primary-ink:#A3BEFF; --primary-soft:rgba(110,155,255,.14);
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.12); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.12); --bad:#F87171; --bad-soft:rgba(248,113,113,.13);
  --c-obat:#6E9BFF; --c-bhp:#2DD4BF; --c-imun:#A78BFA; --c-alkes:#FB923C;
  --grad-hero:radial-gradient(90% 170% at 100% 0%, rgba(90,130,255,.3), transparent 60%), linear-gradient(118deg,#0B1430 0%,#142A66 60%,#2445A8 100%);
  --grad-side:linear-gradient(185deg,#0A0F1F 0%,#0F1C42 60%,#172E6C 100%);
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

/* Warna grafik: pasangan divergen kurang/lebih dan urutan kategorikal alasan (lolos validator CVD, terang & gelap) */
:root{--ser1:#2563eb;--ser2:#38bdf8;--viz-minus:#e34948;--viz-plus:#2563eb;--r1:#2a78d6;--r2:#eb6834;--r3:#1baf7a;--r4:#eda100;--r5:#e87ba4;--r6:#008300;--grid:#e9ecf3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ser1:#3d6ff2;--ser2:#14a3c7;--viz-minus:#e66767;--viz-plus:#3d6ff2;--r1:#3987e5;--r2:#d95926;--r3:#199e70;--r4:#c98500;--r5:#d55181;--r6:#008300;--grid:#222834}}
:root[data-theme="dark"]{--ser1:#3d6ff2;--ser2:#14a3c7;--viz-minus:#e66767;--viz-plus:#3d6ff2;--r1:#3987e5;--r2:#d95926;--r3:#199e70;--r4:#c98500;--r5:#d55181;--r6:#008300;--grid:#222834}

/* Mode ukuran besar: semua ukuran naik 15% (di aplikasi asli cukup menaikkan font-size root, karena Tailwind berbasis rem) */
:root{--vh:100vh}
:root[data-size="besar"]{zoom:1.15;--vh:calc(100vh / 1.15)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.ic.xs{width:12px;height:12px}
.ic.lg{width:20px;height:20px}
.code{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Sidebar ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:var(--rail);padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
  background:var(--grad-side);color:var(--on-grad);display:flex;flex-direction:column;gap:10px;z-index:40;overflow:hidden;
  transition:width .18s ease,box-shadow .18s ease,transform .22s ease}
.sb.x{width:var(--sbw)}
.sb.x.float{box-shadow:var(--shadow-lg)}
.lbl{opacity:0;white-space:nowrap;transition:opacity .12s ease;pointer-events:none}
.sb.x .lbl{opacity:1;pointer-events:auto;transition-delay:.06s}
.sb-head{display:grid;grid-template-columns:44px 1fr auto;align-items:center;height:44px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;justify-self:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sb-brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.sb-brand b{font-size:15px;letter-spacing:.01em}
.sb-brand small{font-size:11.5px;color:var(--on-grad-2)}
.sb-pin{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--on-grad-2);display:grid;place-items:center}
.sb-pin:hover{background:var(--glass);color:var(--on-grad)}
.sb-pin[aria-pressed="true"]{background:var(--glass-2);color:var(--on-grad)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.ng{height:26px;display:flex;align-items:flex-end;padding:0 0 4px 12px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-grad-3);position:relative}
.ng::before{content:"";position:absolute;left:12px;width:20px;bottom:10px;height:1px;background:var(--glass-line);transition:opacity .12s}
.sb.x .ng::before{opacity:0}
.ni{display:grid;grid-template-columns:44px 1fr auto;align-items:center;height:34px;border-radius:9px;color:var(--on-grad-2);text-decoration:none;font-weight:500;font-size:13.5px;border:0;background:transparent;width:100%;text-align:left;padding:0}
.ni:hover{background:var(--glass);color:var(--on-grad)}
.ni.on{background:var(--glass-2);color:var(--on-grad);font-weight:600;box-shadow:inset 0 0 0 1px var(--glass-line)}
.ni-ic{display:grid;place-items:center;position:relative}
.ni-ic .ic{width:17px;height:17px}
.ni-dot{position:absolute;top:-2px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--dot-warn);box-shadow:0 0 0 2px #123A9E;opacity:1;transition:opacity .12s}
.sb.x .ni-dot{opacity:0}
.ni-badge{margin-right:8px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--dot-warn);color:#3A2600}
.sb-foot{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:10px;background:rgba(0,0,0,.18);margin:0 2px}
.theme.two{grid-template-columns:1fr 1fr}
.theme button{height:26px;border:0;border-radius:7px;background:transparent;color:var(--on-grad-2);display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px}
.theme button[aria-pressed="true"]{background:var(--glass-2);color:var(--on-grad)}
.sb-user{display:grid;grid-template-columns:44px 1fr;align-items:center;height:44px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line);color:var(--on-grad);text-decoration:none;padding:0;cursor:pointer;text-align:left;width:100%}
.sb-user .av{justify-self:center;background:#fff;color:#123A9E}
.sb-user span.lbl{display:flex;flex-direction:column;line-height:1.2}
.sb-user small{color:var(--on-grad-2);font-size:11.5px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;background:var(--primary-soft);color:var(--primary-ink)}

/* ---------- Main ---------- */
.main{margin-left:var(--rail);min-height:100%;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:margin-left .18s ease}
body.locked .main{margin-left:var(--sbw)}

.hero{background:var(--grad-hero);color:var(--on-grad);border-radius:16px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;overflow:hidden;transition:border-radius .15s,box-shadow .15s}
/* Saat menempel di atas: sudut atas rata dan diberi bayangan. Mode ringkas (gulir turun) hanya menyisakan baris judul. */
.hero.stuck{border-top-left-radius:0;border-top-right-radius:0;box-shadow:0 10px 28px rgba(10,20,50,.28)}
.hero.compact{padding-block:8px;gap:0}
.hero.compact:not(.peek)>:not(.hero-top),.hero.compact .mock-tag{display:none}
.hero.compact h1{font-size:17px}
/* Intip (pointer di atas header ringkas): header melebar ke bawah menimpa isi, tinggi di alur halaman tetap */
.hero.compact.peek{gap:10px;box-shadow:0 18px 40px rgba(10,20,50,.35)}
.hero.peek>:not(.hero-top),.hero.grow>:not(.hero-top){animation:heroIn .24s cubic-bezier(.2,.7,.2,1) both}
.hrun{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(140px,220px) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line)}
.hrun .bt-ic{background:rgba(251,191,36,.22);color:#FDE68A}
.hrun-tx{min-width:0}
.hrun-tx b{display:block;font-size:13.5px}
.hrun-tx small{display:block;font-size:11.5px;color:var(--on-grad-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrun .prog-l{color:var(--on-grad-2)}
.hrun .prog-l b{color:var(--on-grad)}
.hrun .prog{background:rgba(255,255,255,.18);box-shadow:none}
.hrun .prog span{background:#fff}
@media (max-width:767px){.hrun{grid-template-columns:32px minmax(0,1fr)}.hrun>.rb-prog,.hrun>.btn{grid-column:1 / -1}}
.hero.anim{transition:height .24s cubic-bezier(.2,.7,.2,1),margin-bottom .24s cubic-bezier(.2,.7,.2,1),border-radius .15s,box-shadow .2s}
@keyframes heroIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.hero>*{flex-shrink:0}
/* Tombol pin hanya muncul saat header menempel, atau saat sedang dikunci */
.hero:not(.stuck) .hero-pin:not([aria-pressed="true"]){display:none}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.035) 47px 48px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:10px;min-height:32px}
.hero-top h1{flex:1;min-width:0}
.hbtn[aria-pressed="true"]{background:#fff;color:#123A9E;border-color:#fff}
.hero-tools{display:flex;align-items:center;gap:8px}
.gsearch{display:flex;align-items:center;gap:8px;height:30px;width:260px;padding:0 6px 0 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:var(--on-grad-2)}
.gsearch input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--on-grad);font-size:12.5px}
.gsearch input::placeholder{color:var(--on-grad-3)}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--glass);border:1px solid var(--glass-line);color:var(--on-grad-2)}
.hbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--on-grad);display:grid;place-items:center;position:relative;flex:none}
.hbtn:hover{background:var(--glass-2)}
.hbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:999px;background:var(--dot-bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.hero h1{font-size:21px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:12px;color:var(--on-grad-2);white-space:nowrap}
.stat b{color:var(--on-grad);font-weight:700;font-variant-numeric:tabular-nums}
button.stat:hover{background:var(--glass-2)}
button.stat[aria-pressed="true"]{background:#fff;color:#0F2E80;border-color:#fff}
button.stat[aria-pressed="true"] b{color:#0F2E80}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--dot-ok)}
.st-warn .sdot{background:var(--dot-warn)} .st-bad .sdot{background:var(--dot-bad)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.mock-tag{font-size:11px;color:var(--on-grad-3);white-space:nowrap}

/* ---------- Buttons & form ---------- */
.btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.btn-light{background:#fff;color:#123A9E}
.btn-light:hover{background:#EEF3FF}
.btn-glass{background:var(--glass);border-color:var(--glass-line);color:var(--on-grad)}
.btn-glass:hover{background:var(--glass-2)}
.btn-primary{background:var(--primary-btn);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-outline{background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn-danger{background:transparent;color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-lg{height:38px;font-size:14px}
.icon-btn{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:500;color:var(--muted)}
.input,.select,.textarea{height:32px;width:100%;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);padding:0 10px;font-size:13px;outline:0;transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.affix{position:relative}
.affix>span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);pointer-events:none}
.affix>.input{padding-left:30px}
.hint{font-size:11.5px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.seg button em{font-style:normal;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg.full button{justify-content:center}

/* ---------- Work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;margin-top:12px;align-items:start}
.surface{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.list-wrap{padding:12px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:32px;flex:1 1 220px;min-width:0;max-width:360px;padding:0 10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--faint)}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.search kbd{background:var(--surface-2);border-color:var(--border);color:var(--faint)}
.toolbar .select{width:auto;min-width:150px}
.spacer{flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);font-size:12px;font-weight:600;border:0}
.fchip .ic{width:13px;height:13px}

/* grid card */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(208px,1fr))}
.pcard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-align:left;min-width:0;transition:border-color .12s,box-shadow .12s,transform .12s}
.pcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.pcard.is-sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.pc-top{display:flex;align-items:center;gap:8px;min-height:30px}
.pc-top .code{color:var(--faint);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tone{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}
.tone.sm{width:26px;height:26px;border-radius:8px}
.tone .ic{width:15px;height:15px}
.t-obat{--tc:var(--c-obat)} .t-bhp{--tc:var(--c-bhp)} .t-imun{--tc:var(--c-imun)} .t-alkes{--tc:var(--c-alkes)}
.pc-name{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.brand{align-self:flex-start;display:inline-flex;align-items:center;max-width:100%;height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:700;letter-spacing:.01em;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:-2px}
.brand.generic{color:var(--muted);background:var(--surface-2);font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
.tcard .brand{height:20px;font-size:11.5px;padding:0 7px}
.pc-top .brand,.tc-top .brand{min-width:0;flex:0 1 auto;margin:0}
.cat-ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;flex:none;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}
.cat-ic .ic{width:12px;height:12px}
.pc-sub,.tc-sub{display:flex;align-items:center;gap:6px;min-width:0}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-sub .code{color:var(--faint);font-size:11px}
.pc-zat{font-size:12.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.tcard .pc-zat{font-size:12px;min-height:2.8em}
.more{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong);font-size:11px;font-weight:700;color:var(--fg);vertical-align:1px}
.brand-txt{font-weight:700;color:var(--primary-ink)}
.zat-box{border:1px solid var(--border-strong);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.zat-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.zat-rows{display:flex;flex-direction:column;gap:4px}
.zat-rows:empty{display:none}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 26px;gap:6px;align-items:center;padding:3px 3px 3px 9px;border-radius:6px;background:var(--surface-2)}
.zname{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;font-size:13px;font-weight:500}
.zname .ell{max-width:100%}
.zs{height:26px;font-size:12px;padding:0 8px}
.zrow .icon-btn{width:26px;height:26px}
.zfix{flex:none;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;border:0;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:600;white-space:nowrap}
.zat-add{border:0;outline:0;background:transparent;height:28px;padding:0 6px;font-size:13px;min-width:0}
.brand-txt.generic{font-weight:600;color:var(--muted)}
.pc-sub{font-size:12px;color:var(--muted);margin-top:-2px}
.pc-desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;line-height:1.45}
.meter{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.meter span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter .m-menipis{background:var(--warn)} .meter .m-habis{background:var(--bad)}
.pc-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.pc-foot b{color:var(--fg);font-variant-numeric:tabular-nums}
.pc-foot em{font-style:normal;color:var(--faint)}
.price{font-weight:700;color:var(--fg);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;flex:none}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--primary-soft);color:var(--primary-ink)}
.c-plain{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)} .c-plain::before{display:none}

/* row list */
.rows{display:flex;flex-direction:column;gap:2px}
.day{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.day:first-child{padding-top:0}
.row{display:grid;grid-template-columns:32px minmax(0,1.25fr) minmax(0,1.2fr) 112px 96px;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.row:hover{background:var(--surface-2)}
.row.is-sel{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.row .av{width:32px;height:32px}
.r-main,.r-mid{display:flex;flex-direction:column;min-width:0}
.r-main b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main small,.r-mid small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-mid span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.r-st{display:flex;justify-content:flex-end}

/* pager */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.pager b{color:var(--fg);font-variant-numeric:tabular-nums}
.pg{display:flex;gap:3px;align-items:center}
.pg button{min-width:28px;height:28px;padding:0 6px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.pg button:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
.pg button[aria-current="page"]{background:var(--primary-btn);color:#fff;font-weight:600}
.pg button:disabled{opacity:.35;cursor:default}
.pg .gap{width:20px;text-align:center;color:var(--faint)}
.pg-note{font-size:11.5px;color:var(--faint)}

/* side panel */
.side{position:sticky;top:calc(var(--hero-h, 0px) + 12px);max-height:calc(var(--vh) - var(--hero-h, 0px) - 24px);display:flex;flex-direction:column;overflow:hidden}
.side-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--border)}
.side-head .tone{width:36px;height:36px;border-radius:10px}
.side-head h3{margin:1px 0 0;font-size:15.5px;line-height:1.3;font-weight:700;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.side-head .grow{flex:1;min-width:0}
.side-close{display:none}
.side-body{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.side-foot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mini div{padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.mini div+div{border-left:1px solid var(--border)}
.mini small{font-size:11px;color:var(--faint)}
.mini b{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-t{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-weight:500}
.lines{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;font-size:13px}
.line+.line{border-top:1px solid var(--border)}
.line small{grid-column:1;font-size:12px;color:var(--muted)}
.line .amt{grid-row:1 / span 2;grid-column:2;align-self:center;font-weight:600;font-variant-numeric:tabular-nums}
.totals{display:flex;flex-direction:column;gap:5px;font-size:13px}
.totals div{display:flex;justify-content:space-between;color:var(--muted)}
.totals div b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.totals .grand{padding-top:8px;margin-top:3px;border-top:1px dashed var(--border-strong);color:var(--fg);font-weight:600}
.totals .grand b{font-size:17px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:0;padding-left:4px}
.tl-i{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:12.5px;position:relative;padding-bottom:12px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--border)}
.tl-i:last-child::before{display:none}
.tl-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);background:var(--ok);box-shadow:0 0 0 1px var(--border-strong);margin-top:2px}
.tl-dot.wait{background:var(--warn)}
.tl-i small{display:block;color:var(--muted)}
.receipt{height:120px;border-radius:10px;border:1px dashed var(--border-strong);background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:28px 12px;color:var(--muted);font-size:13px}
.empty .tone{width:40px;height:40px;border-radius:12px;--tc:var(--primary)}
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.cat-item small{color:var(--muted);font-size:12px}

/* ---------- Notifikasi, pengguna, profil ---------- */
.t-ok{--tc:var(--ok)} .t-warn{--tc:var(--warn)} .t-bad{--tc:var(--bad)}
.tav{background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.rchip{color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}
.rchip::before{display:none}
.nrow{grid-template-columns:32px minmax(0,1fr) auto 8px}
.nrow .tone{width:32px;height:32px}
.nrow b{font-weight:500}
.nrow.unread b{font-weight:700}
.nrow.unread{background:color-mix(in srgb,var(--primary) 4%,transparent)}
.nrow.unread.is-sel,.nrow.is-sel{background:var(--primary-soft)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.nrow:not(.unread) .udot{visibility:hidden}
.n-time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.n-msg{margin:0;font-size:13.5px;line-height:1.55}
.setlist{display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.setrow+.setrow{border-top:1px solid var(--border)}
.setrow .grow{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:1px}
.setrow b{font-size:13.5px;font-weight:600}
.setrow small{font-size:12px;color:var(--muted)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--border-strong);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--primary-btn)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.ucard{gap:10px}
.u-top{display:flex;align-items:center;gap:10px;min-width:0}
.ucard .av{width:40px;height:40px;font-size:13px}
.u-id{display:flex;flex-direction:column;min-width:0}
.u-id b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-id small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-roles{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.u-last{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.u-last::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.u-last.on{color:var(--ok);font-weight:600} .u-last.on::before{background:var(--ok)}
.u-last.never{color:var(--warn)} .u-last.never::before{background:var(--warn)}
.rolelist{display:flex;flex-direction:column;gap:6px}
.rolebox{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.rolebox:hover{border-color:var(--border-strong)}
.rolebox:has(input:checked){border-color:color-mix(in srgb,var(--primary) 55%,transparent);background:color-mix(in srgb,var(--primary) 5%,var(--surface))}
.rolebox input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--primary-btn)}
.rolebox small{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.pw{position:relative}
.pw .input{padding-right:64px}
.pw-btns{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;gap:1px}
.pw-btns .icon-btn{width:26px;height:26px}
.reset-box{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--border-strong);border-radius:10px}
.profile{display:grid;grid-template-columns:272px minmax(0,1fr);gap:12px;margin:12px auto 0;max-width:1040px;align-items:start}
.pf-card{position:sticky;top:12px;padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.pf-av{position:relative}
.pf-av .av{width:88px;height:88px;font-size:28px}
.pf-cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--primary-btn);color:#fff;display:grid;place-items:center;border:3px solid var(--surface);cursor:pointer}
.pf-cam input{position:absolute;opacity:0;width:1px;height:1px}
.pf-card h2{margin:0;font-size:17px}
.pf-card p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pf-card .dl{width:100%;text-align:left;padding-top:12px;border-top:1px solid var(--border)}
.pf-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.pf-sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.pf-h h2{margin:0;font-size:15px}
.pf-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.pf-f{display:flex;justify-content:flex-end}
.pw-meter{display:flex;flex-direction:column;gap:6px;margin-top:-4px}
.meter4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:280px}
.meter4 span{height:4px;border-radius:9px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}.pf-card{position:static}}
@media (max-width:560px){.pf-sec .row2{grid-template-columns:minmax(0,1fr)}}

/* ---------- Dashboard ---------- */
.hero-sum{margin:2px 0 0;font-size:17px;line-height:1.35;color:var(--on-grad-2);font-weight:500;text-wrap:balance}
.hero-sum b{color:var(--on-grad);font-weight:700}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.btile{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line);color:var(--on-grad);text-align:left;min-width:0}
.btile:hover{background:var(--glass-2)}
.bt-ic{width:32px;height:32px;border-radius:9px;background:var(--glass-2);display:grid;place-items:center}
.bt-tx{min-width:0}
.bt-tx b{display:block;font-size:13px}
.bt-tx small{display:block;font-size:11.5px;color:var(--on-grad-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;margin-top:12px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 4px}
.task+.task{border-top:1px solid var(--border)}
.task .tone{width:32px;height:32px}
.task-tx{min-width:0}
.task-tx b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .meta{font-size:12px;color:var(--faint);white-space:nowrap}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;min-width:72px}
.ch-in{fill:var(--ser1);pointer-events:none} .ch-out{fill:var(--ser2);pointer-events:none}
.tl2{display:flex;flex-direction:column}
.tline{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:10px;align-items:start;position:relative;padding:0 4px 12px 0;border:0;background:transparent;text-align:left;width:100%;border-radius:8px}
.tline:hover .tl-tx b{color:var(--primary-ink)}
.tline::before{content:"";position:absolute;left:59px;top:14px;bottom:0;width:2px;background:var(--border)}
.tline:last-child{padding-bottom:0}
.tline:last-child::before{display:none}
.tl-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--tc);box-shadow:0 0 0 3px var(--surface),0 0 0 4px color-mix(in srgb,var(--tc) 40%,transparent);position:relative;z-index:1}
.tl-tx{min-width:0}
.tl-tx b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigval{display:flex;flex-direction:column;gap:1px}
.bigval small{font-size:12px;color:var(--muted)}
.bigval b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bigval em{font-style:normal;font-size:11.5px;color:var(--faint)}
.slegend{display:flex;gap:6px;flex-wrap:wrap}
.slegend button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted)}
.slegend button:hover{border-color:var(--border-strong);color:var(--fg)}
.slegend b{color:var(--fg);font-variant-numeric:tabular-nums}
.catrows{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:20px 84px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.catrow small{display:block;font-size:11px;color:var(--faint)}
.catrow b{font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.cr-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cr-bar span{display:block;height:100%;border-radius:3px}
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.exrow+.exrow{border-top:1px solid var(--border)}
.ex-tx{min-width:0}
.ex-tx>b{display:block;font-size:13px;font-weight:600}
.ex-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-d{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ex-d small{font-size:11px;color:var(--faint)}
@media (max-width:1180px){.dgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.task{grid-template-columns:32px minmax(0,1fr) auto}.task .meta{display:none}.hero-sum{font-size:15px}}

/* ---------- Stok opname ---------- */
.v-neg{color:var(--bad)!important} .v-pos{color:var(--primary-ink)!important}
.dash{margin-top:12px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

/* Ringkasan selisih: rentang ini juga menyaring opname selesai di daftar */
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function opnRange() {
  const r = st.opn.range;
  if (r === 'custom') {
    const f = new Date(st.opn.from + 'T00:00:00'), t = new Date(st.opn.to + 'T23:59:59');
    const same = isoDay(f) === isoDay(t);
    return { from: f, to: t, label: same ? fmtDate(f) : `${f.getDate()} ${BLN[f.getMonth()]}${f.getFullYear() !== t.getFullYear() ? ' ' + f.getFullYear() : ''} – ${fmtDate(t)}` };
  }
  return { from: new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - +r + 1), to: new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate(), 23, 59, 59),
    label: { 7: '7 hari terakhir', 30: '30 hari terakhir', 90: '3 bulan terakhir', 365: '12 bulan terakhir' }[r] };
}
const inRange = d => { const r = opnRange(); return d >= r.from && d <= r.to; };
const sumOf = a => a.reduce((x, y) => x + y, 0);
function rangeData(from, to) {
  const hs = HIST.filter(h => h.date >= from && h.date <= to);
  const items = hs.flatMap(h => h.items), diffs = items.filter(x => x.final !== x.sys), vals = diffs.map(itemVal);
  return { hs, items, diffs, minus: sumOf(vals.filter(v => v < 0)), plus: sumOf(vals.filter(v => v > 0)), net: sumOf(vals) };
}

  const accTxt = acc === null ? '—' : acc.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%';
  const toggle = `<button class="icon-btn" data-act="dash-toggle" aria-expanded="${open}" aria-label="${open ? 'Ciutkan' : 'Buka'} ringkasan selisih">${ic(open ? 'chevron-up' : 'chevron-down')}</button>`;
  if (!open) {
    el.innerHTML = `<div class="dash-h"><h2>Ringkasan selisih</h2><span class="sub">${R.label} · bersih <b>${rpSigned(d.net)}</b> · akurasi <b>${accTxt}</b> · ${d.hs.length} sesi</span><span class="spacer"></span>${toggle}</div>`;
    return paint();
  }
  const agg = {}; d.diffs.forEach(x => { agg[x.id] = (agg[x.id] || 0) + itemVal(x); });
  const top = Object.entries(agg).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 5), topMax = Math.max(1, ...top.map(t => Math.abs(t[1])));
  const rc = REASONS.map((r, i) => { const xs = d.diffs.filter(x => x.reason === r); return { r, i, n: xs.length, v: sumOf(xs.map(itemVal)) }; }).filter(x => x.n);
  el.innerHTML = `<div class="dash-h"><h2>Ringkasan selisih</h2><span class="sub">${R.label}</span><span class="spacer"></span>
      <div class="seg" role="group" aria-label="Rentang waktu">${segBtns([['7', '7 hari'], ['30', '30 hari'], ['90', '3 bln'], ['365', '12 bln'], ['custom', 'Atur…']], st.opn.range, 'dash-range')}</div>
      ${st.opn.range === 'custom' ? `<span class="drange"><input type="date" class="input" id="d-from" value="${st.opn.from}" max="${isoDay(NOW)}" aria-label="Dari tanggal">–<input type="date" class="input" id="d-to" value="${st.opn.to}" max="${isoDay(NOW)}" aria-label="Sampai tanggal"></span>` : ''}${toggle}</div>
    <div class="kpis">
      <div><small>Nilai bersih</small><b>${rpSigned(d.net)}</b><em>${d.diffs.length} produk selisih</em></div>
      <div><small><i class="sw8" style="background:var(--viz-minus)"></i>Kurang</small><b>${rpSigned(d.minus)}</b><em>${d.diffs.filter(x => x.final < x.sys).length} produk</em></div>
      <div><small><i class="sw8" style="background:var(--viz-plus)"></i>Lebih</small><b>${rpSigned(d.plus)}</b><em>${d.diffs.filter(x => x.final > x.sys).length} produk</em></div>
      <div><small>Akurasi hitung</small><b>${accTxt}</b><em>${d.items.length - d.diffs.length} dari ${d.items.length} produk cocok</em></div>
      <div><small>Opname selesai</small><b>${d.hs.length} sesi</b><em>${d.items.length} produk dihitung</em></div>
    </div>
    ${d.hs.length ? `<div class="dash-grid">

function barChart(box, bks, series, opt) {
  if (!box) return;
  const W = Math.max(260, Math.round(box.clientWidth)), H = 180, L = 58, Rt = 6, T = 10, B = 24, pw = W - L - Rt, ph = H - T - B;
  const tot = b => sumOf(series.map(s => b.v[s.k] || 0));
  const max = Math.max(1, ...bks.map(b => opt.stacked ? tot(b) : Math.max(...series.map(s => b.v[s.k] || 0))));
  const y = v => T + ph - v / max * ph, y0 = y(0), band = pw / bks.length, every = Math.ceil(bks.length / Math.max(1, Math.floor(pw / 60)));

    const cx = L + band * i + band / 2;
    let out = `<rect class="ch-hit" x="${L + band * i + 1}" y="${T}" width="${band - 2}" height="${ph}" rx="6" data-i="${i}" tabindex="0" ${b.arg ? `data-act="${opt.act}" data-arg="${b.arg}"` : ''} aria-label="${b.full}"/>`;
    if (opt.stacked) {

      segs.forEach((s, j) => { const h = Math.max(3, b.v[s.k] / max * ph), top = base - h; out += j === segs.length - 1 ? `<path class="${s.cls}" d="${barUp(cx - bw / 2, top, base, bw)}"/>` : `<rect class="${s.cls}" x="${cx - bw / 2}" y="${top + 2}" width="${bw}" height="${h - 2}"/>`; base = top; });
    } else {
      const n = series.length, bw = Math.max(4, Math.min(16, band * .7 / n)), start = cx - (n * bw + (n - 1) * 2) / 2;
      series.forEach((s, j) => { const v = b.v[s.k] || 0; if (v) out += `<path class="${s.cls}" d="${barUp(start + j * (bw + 2), Math.min(y(v), y0 - 3), y0, bw)}"/>`; });
    }
    return out + (i % every === 0 ? `<text class="ch-lbl" x="${cx}" y="${H - 6}" text-anchor="middle">${b.label}</text>` : '');
  }).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${opt.aria}">

    <line class="ch-zero" x1="${L}" x2="${W - Rt}" y1="${y0}" y2="${y0}"/><text class="ch-lbl" x="${L - 8}" y="${y0 + 3.5}" text-anchor="end">0</text>${marks}</svg><div class="tip" hidden></div>`;
  const tip = box.querySelector('.tip');
  $$('.ch-hit', box).forEach(r => {
    const show = () => { const b = bks[+r.dataset.i]; tip.innerHTML = opt.tip(b) + (b.arg ? '<br><span>klik untuk menyaring periode ini</span>' : '');
      tip.style.left = Math.min(Math.max(+r.getAttribute('x') + +r.getAttribute('width') / 2, 110), W - 110) / W * 100 + '%'; tip.style.top = y(opt.stacked ? tot(b) : Math.max(...series.map(s => b.v[s.k] || 0))) + 'px'; tip.hidden = false; };
    r.addEventListener('mouseenter', show); r.addEventListener('focus', show);
    r.addEventListener('mouseleave', () => { tip.hidden = true; }); r.addEventListener('blur', () => { tip.hidden = true; });

  ro.observe(el);
}

  'prod-sel': a => { st.prod.sel = a; st.prod.mode = 'edit'; st.prod.formCat = null; st.prod.zat = null; renderProdGrid(); renderProdPanel(); openSide(); },
  'prod-new': () => { st.prod.mode = 'new'; st.prod.formCat = 'Obat'; st.prod.zat = null; renderProdGrid(); renderProdPanel(); openSide(); setTimeout(() => $('#f-brand')?.focus(), 50); },
  'prod-cancel': () => { st.prod.mode = 'edit'; st.prod.formCat = null; st.prod.zat = null; renderProdGrid(); renderProdPanel(); closeSide(); },
  'zat-rm': a => { st.prod.zat.splice(+a, 1); renderZatRows(); },
  'zat-fix': a => { const z = st.prod.zat[+a]; z[0] = closeZat(z[0]); renderZatRows(); toast(`Diganti ke ${z[0]}.`); },
  'prod-cat': a => { st.prod.cat = a; st.pg.prod = 1; $$('[data-act="prod-cat"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === a))); renderProdGrid(); },
  'prod-status': a => { st.prod.status = st.prod.status === a ? '' : a; st.pg.prod = 1; renderProdGrid(); },
  'form-cat': a => { st.prod.formCat = a; renderProdPanel(); },
  // jasa
  'svc-sel': a => { st.svc.sel = a; st.svc.mode = 'edit'; renderSvcGrid(); renderSvcPanel(); openSide(); },
  'svc-new': () => { st.svc.mode = 'new'; renderSvcGrid(); renderSvcPanel(); openSide(); setTimeout(() => $('#s-name')?.focus(), 50); },
  'svc-cats': () => { st.svc.mode = 'cats'; renderSvcGrid(); renderSvcPanel(); openSide(); },
  'svc-back': () => { st.svc.mode = 'edit'; renderSvcGrid(); renderSvcPanel(); closeSide(); },
  // keluar & masuk
  'out-sel': a => { st.out.sel = a; renderOutRows(); renderOutPanel(); openSide(); },
  'out-tab': a => { st.out.tab = st.out.tab === a && a === 'Menunggu' && event?.target?.closest('.hero') ? 'Semua' : a; st.pg.out = 1; renderOutRows(); },
  'out-process': a => { const t = OUT.find(o => o.id === a); t.status = 'Selesai'; t.doneAt = new Date(NOW.getTime() + 60000); if (st.page === 'laporan') renderRepData(); else renderOutRows(); renderOutPanel(); renderNav(); toast(`${t.code} diproses. Stok dikurangi.`); },
  'in-sel': a => { st.inn.sel = a; renderInRows(); renderInPanel(); openSide(); },
  'in-exp': () => { st.inn.exp = !st.inn.exp; st.pg.in = 1; renderInRows(); },
  // POS keluar
  'pos-out': a => { st.posOut.mode = a || 'Permintaan'; if (a === 'Manual') st.posOut.tab = 'produk'; go('pos-keluar'); },
  'pos-mode': a => { st.posOut.mode = a; if (a === 'Manual') st.posOut.tab = 'produk'; render(); },
  'pos-tab': a => { st.posOut.tab = a; st.posOut.cat = 'Semua'; st.pg.posOut = 1; $$('[data-act="pos-tab"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === a))); renderPosGrid(); },
  'pos-cat': a => { st.posOut.cat = a; st.pg.posOut = 1; renderPosGrid(); },
  'pos-add': a => { const p = P(a), line = st.posOut.items.find(i => i.id === a); if ((line?.qty || 0) >= p.stock) { toast(`Stok ${p.name} hanya ${p.stock}.`); return; } line ? line.qty++ : st.posOut.items.push({ id: a, qty: 1 }); renderCart(); renderPosGrid(); },
  'pos-dec': a => { const line = st.posOut.items.find(i => i.id === a); line.qty--; if (line.qty <= 0) st.posOut.items = st.posOut.items.filter(i => i.id !== a); renderCart(); renderPosGrid(); },
  'pos-rm': a => { st.posOut.items = st.posOut.items.filter(i => i.id !== a); renderCart(); renderPosGrid(); },
  'pos-svc': a => { const s = st.posOut.svcs; st.posOut.svcs = s.includes(a) ? s.filter(x => x !== a) : [...s, a]; renderCart(); renderPosGrid(); },
  'pos-clear': () => { st.posOut.items = []; st.posOut.svcs = []; renderCart(); renderPosGrid(); },
  'pos-submit': () => toast(st.posOut.mode === 'Manual' ? 'Stok dikeluarkan (mockup, tidak disimpan).' : 'Permintaan diajukan ke farmasi (mockup, tidak disimpan).'),
  'cart-open': () => { $('#cart').classList.add('show'); document.body.classList.add('cart-open'); },
  'cart-close': () => { $('#cart').classList.remove('show'); document.body.classList.remove('cart-open'); },
  // POS masuk
  'posin-cat': a => { st.posIn.cat = a; st.pg.posIn = 1; renderPosInGrid(); },
  'in-restock': () => { st.posIn.restock = !st.posIn.restock; st.pg.posIn = 1; renderPosInGrid(); },
  'in-add': a => { const p = P(a), line = st.posIn.items.find(i => i.id === a); const step = p.unit === 'Tablet' ? 50 : p.unit === 'Pcs' && p.cat === 'BHP' ? 10 : 1; line ? line.qty += step : st.posIn.items.push({ id: a, qty: step, batch: '', exp: '', buy: p.buy }); renderInCart(); renderPosInGrid(); },
  'in-dec': a => { const p = P(a), line = st.posIn.items.find(i => i.id === a); const step = p.unit === 'Tablet' ? 50 : p.unit === 'Pcs' && p.cat === 'BHP' ? 10 : 1; line.qty -= step; if (line.qty <= 0) st.posIn.items = st.posIn.items.filter(i => i.id !== a); renderInCart(); renderPosInGrid(); },
  'in-rm': a => { st.posIn.items = st.posIn.items.filter(i => i.id !== a); renderInCart(); renderPosInGrid(); },
  'in-clear': () => { st.posIn.items = []; renderInCart(); renderPosInGrid(); },
  'in-submit': () => { const miss = st.posIn.items.filter(i => !i.batch || !i.exp).length; toast(miss ? `${miss} produk belum diisi batch atau tanggal kedaluwarsa.` : 'Penerimaan disimpan (mockup, tidak disimpan).'); },
};
let event = null;
document.addEventListener('click', e => {
  // Klik di luar panel notifikasi menutupnya (dicek sebelum aksi supaya target masih ada di DOM)
  const np = $('#npop');
  if (!np.hidden && !np.contains(e.target) && !e.target.closest('[data-act="npop"]')) closeNpop();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  event = e; fn(el.dataset.arg, el); event = null;
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { const s = $('#pos-q') || $('#posin-q') || $('#prod-q') || $('#svc-q') || $('#out-q') || $('#in-q'); if (s) { e.preventDefault(); s.focus(); } }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { const g = $('#gsearch'); if (g && getComputedStyle(g.parentElement).display !== 'none') { e.preventDefault(); g.focus(); } }
  if (e.key === 'Escape') { const np = $('#npop'); if (!np.hidden) { closeNpop(true); return; } ACT.scrim(); }
});
window.addEventListener('resize', () => { if (!isMobile() && st.drawer) { st.drawer = false; syncSidebar(); } if (wide()) closeSide(); });

/* ================= Boot ================= */
setTheme(store.get('opx-theme') || 'system');
setSize(store.get('opx-size') || 'standar');
const start = (location.hash || '').slice(1);
if (PAGES[start]) st.page = start;
syncSidebar();
render();
})();
</script>
